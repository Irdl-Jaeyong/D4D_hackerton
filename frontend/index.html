<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVIS-AI</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>NAVIS<span>-AI</span></b><small>D4D · Multi-UxV Control</small></div><p id="health">서버 확인 중</p></header>
<main><section class="scene"><div class="title"><h2>시뮬레이션 카메라</h2><span>USV-01 · LIVE</span></div><div class="camera"><img id="camera" alt="USV-01의 Gazebo 카메라"><p id="cameraEmpty">시뮬레이션 카메라 연결 대기</p></div><div class="title"><h2>위치 모니터</h2><span>ROS odometry · 2D</span></div><canvas id="map" width="760" height="300"></canvas><p class="note">준비용 MVP · UAV 4대 + USV 2대 상태 연동 / 명령 실행은 아직 구현 전</p></section>
<section><div class="title"><h2>장비 상태</h2><span id="connected">0 / 6 연결</span></div><div id="cards" class="cards"></div><div class="chat"><div class="title"><h2>AI 대화</h2><span>MiniCPM-V 4.5</span></div><div id="messages" aria-live="polite"><p class="bubble ai">실제 기체 상태를 질문하거나 카메라 화면을 분석할 수 있습니다. 이동 명령은 실행되지 않습니다.</p></div><form id="chatForm"><label class="toggle"><input type="checkbox" id="useCamera"> USV-01 카메라 첨부</label><div class="inputrow"><input id="message" maxlength="2000" placeholder="전체 연결 상태를 요약해줘" required autocomplete="off"><button id="send">전송</button></div><p id="chatStatus" class="note"></p></form></div></section>
<section class="events"><div class="title"><h2>이벤트 타임라인</h2><span>연결 변경 기록</span></div><ul id="events"><li>백엔드 연결 대기</li></ul></section></main><script src="app.js"></script></body></html>
